# ============================================================================
# Mango
# ============================================================================

blur=0
blur_layer=0
shadows=0
border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

gappih=0
gappiv=0
gappoh=0
gappov=0
borderpx=2

rootcolor=0x111317ff
bordercolor=0x3A3E47ff
focuscolor=0x50A4E9ff
maximizescreencolor=0x5EB7FFff
urgentcolor=0xCC83E3ff
scratchpadcolor=0x50A4E9ff
globalcolor=0xCC83E3ff
overlaycolor=0x5EB7FFff

no_border_when_single=0
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=10

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tagrule=id:10,layout_name:tile

xwayland_persistence=1
syncobj_enable=1
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
drag_tile_to_tile=1
cursor_size=24

repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_middle_button_emulation=1

exec-once=:
exec-once=swaybg -i /home/tyler/Pictures/Hilltopper.png
exec-once=mako
exec-once=udiskie
exec-once=nm-applet
exec-once=blueman

# ----------------------------------------------------------------------------
# Applications
# ----------------------------------------------------------------------------

bind=SUPER,Return,spawn,kitty
bind=SUPER,d,spawn,fuzzel
bind=SUPER,q,killclient

# ----------------------------------------------------------------------------
# Notifications
# ----------------------------------------------------------------------------

bind=CTRL,space,spawn,makoctl dismiss

# ----------------------------------------------------------------------------
# Screenshots
# ----------------------------------------------------------------------------

bind=SUPER+SHIFT,p,spawn_shell,grim - | swappy -f -
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" - | swappy -f -

# ----------------------------------------------------------------------------
# Reload / Exit
# ----------------------------------------------------------------------------

bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,e,spawn,wlogout

# ----------------------------------------------------------------------------
# Focus
# ----------------------------------------------------------------------------

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# ----------------------------------------------------------------------------
# Move Windows
# ----------------------------------------------------------------------------

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# ----------------------------------------------------------------------------
# Workspaces
# ----------------------------------------------------------------------------

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

bind=SUPER,Tab,view,-1,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0

# ----------------------------------------------------------------------------
# Layout
# ----------------------------------------------------------------------------

bind=SUPER,b,setlayout,tile
bind=SUPER,v,setlayout,vertical_tile
bind=SUPER,m,setlayout,monocle
bind=SUPER,e,setlayout,scroller
bind=SUPER,t,switch_layout
bind=SUPER,w,setlayout,deck
bind=SUPER,f,togglefullscreen

# ----------------------------------------------------------------------------
# Floating
# ----------------------------------------------------------------------------

bind=SUPER,c,togglefloating
bind=SUPER,z,focuslast

# ----------------------------------------------------------------------------
# Resize
# ----------------------------------------------------------------------------

bind=SUPER+ALT,h,resizewin,-20,0
bind=SUPER+ALT,j,resizewin,0,-20
bind=SUPER+ALT,k,resizewin,0,+20
bind=SUPER+ALT,l,resizewin,+20,0

# ----------------------------------------------------------------------------
# Media
# ----------------------------------------------------------------------------

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# ----------------------------------------------------------------------------
# Mouse
# ----------------------------------------------------------------------------

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# ----------------------------------------------------------------------------
# Scrolling
# ----------------------------------------------------------------------------

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
