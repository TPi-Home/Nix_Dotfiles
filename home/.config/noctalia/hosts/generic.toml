config_version = 15

[include]
files = ["/home/tyler/Nix_Dot_Files/home/.config/noctalia/palettes/"]

[accessibility]
ui_scale = 1.5

[bar.default]
background_opacity = 0.85
end = [
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]
font_family = "UbuntuSans NF"
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.5
thickness = 50
widget_spacing = 10

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]
pre_action_fade_seconds = 0

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = false
timeout = 600.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 360.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[notification]
scale = 1.5

[osd]
scale = 1.5

[osd.kinds]
nightlight = false

[shell]
font_family = "UbuntuSans NF"
time_format = "{:%-I:%M %p}"

[shell.panel]
control_center_placement = "attached"
transparency_mode = "glass"

[wallpaper]
directory = "/home/tyler/Nix_Dot_Files/reference"
fill_mode = "fit"

[wallpaper.default]
path = "/home/tyler/Nix_Dot_Files/reference/Hilltopper.png"

[wallpaper.last]
path = "/home/tyler/Nix_Dot_Files/reference/Hilltopper.png"

[widget.clock]
format = "{:%-I:%M %p}"
font_scale = 1.5
font_weight = 700

[widget.workspaces]
active_pill_size = 2.5
inactive_pill_size = 1.5

[location]
auto_locate = true

[weather]
unit = "imperial"